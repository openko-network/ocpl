<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" width="560" height="160">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&amp;family=IBM+Plex+Sans:wght@400&amp;display=swap');
      .title {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 64px;
        font-weight: 600;
        fill: #F4F5F7;
        letter-spacing: -0.02em;
      }
      .tagline {
        font-family: 'IBM Plex Sans', sans-serif;
        font-size: 16px;
        font-weight: 400;
        fill: #9CA3AF;
        letter-spacing: 0.05em;
      }
    </style>
  </defs>
  <rect width="560" height="160" fill="#0A0A0F"/>
  
  <g transform="translate(16, 16)">
    <!-- Outer ring -->
    <circle cx="64" cy="64" r="56" fill="none" stroke="#1E1E2E" stroke-width="2"/>
    <circle cx="64" cy="64" r="56" fill="none" stroke="#E8A020" stroke-width="2" stroke-dasharray="4 8" opacity="0.3"/>
    <circle cx="64" cy="64" r="60" fill="none" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="2 12" opacity="0.4"/>
    
    <!-- Foundation line -->
    <line x1="36" y1="96" x2="92" y2="96" stroke="#E8A020" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Lock body -->
    <rect x="44" y="60" width="40" height="28" rx="4" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="64" cy="74" r="3" fill="#38bdf8"/>
    <path d="M64 77 v6" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Open shackle -->
    <path d="M76 60 V44 A12 12 0 0 0 52 44 V48" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="square"/>
  </g>

  <text x="160" y="94" class="title">ocpl</text>
  <text x="164" y="122" class="tagline">open protocols · identity sovereignty · no lock-in</text>
</svg>
